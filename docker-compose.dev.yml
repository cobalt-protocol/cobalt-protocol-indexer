version: '3.8'

services:
  kubo:
    image: ipfs/kubo:latest
    container_name: kelola_limbah_kubo_staging
    restart: unless-stopped
    ports:
      - "${KUBO_SWARM_PORT:-4001}:4001"
      # Bind API to localhost only on the host machine to allow Web UI access safely
      - "127.0.0.1:${KUBO_API_PORT:-5001}:5001"
      - "${KUBO_GATEWAY_PORT:-8081}:8080"
    environment:
      IPFS_PROFILE: server
    volumes:
      - kubo_staging_data:/data/ipfs:U
      - kubo_staging_export:/export:U
      - ./scripts/kubo-init.sh:/container-init.d/01-bind-api.sh:ro
    networks:
      default:
        aliases:
          - kubo
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  kubo_staging_data:
  kubo_staging_export:

