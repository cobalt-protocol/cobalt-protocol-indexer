version: '3.8'

services:
  # Indexer API — port customizable via .env PORT / HOST or CLI --port/--host
  # Example: PORT=9000 docker compose -f docker-compose.dev.yml up
  indexer-api:
    image: python:3.11-slim
    container_name: cobalt_protocol_indexer_api_dev
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8000}
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      kubo:
        condition: service_healthy
    command: >
      bash -c "pip install -r requirements.txt && python main.py --host 0.0.0.0 --port $${PORT:-8000} --reload"
    networks:
      default:
        aliases:
          - indexer-api

  kubo:
    image: ipfs/kubo:latest
    container_name: cobalt_protocol_kubo_dev
    restart: unless-stopped
    ports:
      - "${KUBO_SWARM_PORT:-4001}:4001"
      # Bind API to localhost only on the host machine to allow Web UI access safely
      - "${KUBO_API_PORT:-5001}:5001"
      - "${KUBO_GATEWAY_PORT:-8081}:8080"
    environment:
      IPFS_PROFILE: server
    volumes:
      - kubo_dev_data:/data/ipfs:U
      - kubo_dev_export:/export:U
      - ./kubo-init.sh:/container-init.d/01-bind-api.sh:ro
    networks:
      default:
        aliases:
          - kubo
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  kubo_dev_data:
  kubo_dev_export:


